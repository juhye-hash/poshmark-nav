<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poshmark — Feed Channel</title>
<style>
/* ===================== FONTS ===================== */
@font-face {
  font-family: 'Nantes';
  src: url('../fonts/Nantes.woff2') format('woff2');
}
@font-face {
  font-family: 'Graphik';
  font-weight: 400;
  src: url('drive-download-20260410T064422Z-3-001/Graphik-Regular-Web.woff2') format('woff2');
}
@font-face {
  font-family: 'Graphik';
  font-weight: 500;
  src: url('drive-download-20260410T064422Z-3-001/Graphik-Medium-Web.woff2') format('woff2');
}
@font-face {
  font-family: 'Graphik';
  font-weight: 600;
  src: url('drive-download-20260410T064422Z-3-001/Graphik-Semibold-Web.woff2') format('woff2');
}

/* ===================== BASE ===================== */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Graphik',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  font-size:14px;color:#121212;background:#fff;min-width:1280px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}

/* ===================== TOKENS ===================== */
:root {
  --black:         #121212;
  --white:         #ffffff;
  --divider:       #ececec;
  --search-bg:     #f6f6f6;
  --search-stroke: #e3e3e3;
  --gray-300:      #717171;
  --posh-live:     #ba4e41;
}

/* ===================== NAV ===================== */
.nav-bar {
  background: var(--white);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--divider);
}

/* Mobile base (hidden on desktop) */
.nav-middle-row {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  position: relative;
}
.nav-mobile-left  { display: flex; align-items: center; gap: 8px; }
.nav-mobile-right { display: flex; align-items: center; }
.nav-logo-desktop,
.nav-search,
.nav-right-desktop,
.nav-submenu-row  { display: none; }

/* Desktop ≥992px */
@media (min-width: 992px) {
  .nav-mobile-left, .nav-mobile-right { display: none; }
  .nav-logo-desktop  { display: flex; align-items: center; flex-shrink: 0; }
  .nav-right-desktop { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  .nav-middle-row {
    height: 80px;
    border-bottom: none;
    padding: 0 max(20px, calc((100vw - 1388px) / 2));
  }
  .nav-search {
    display: flex; align-items: center;
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(370px, calc(104.67vw - 746.8px), 706px);
    height: 44px;
    background: var(--search-bg);
    border: 1px solid var(--search-stroke);
    border-radius: 60px;
    padding: 0 14px 0 20px;
    cursor: pointer;
  }
  .nav-submenu-row {
    display: flex; align-items: center;
    height: 48px;
    border-top: 1px solid var(--divider);
    padding: 0 20px;
  }
}

/* Desktop ≥1067px: submenu padding jumps to 56px */
@media (min-width: 1067px) {
  .nav-submenu-row {
    padding: 0 max(56px, calc((100vw - 1388px) / 2 + 56px));
  }
}

/* Logo */
.logo-desktop { width: 134px; height: 22px; display: block; }
.logo-mobile  { width: 112px; height: 20px; display: block; }

/* Hamburger */
.icon-shopby { width: 24px; height: 24px; flex-shrink: 0; }

/* Buttons */
.btn-black-md {
  height: 36px; padding: 0 14px;
  background: var(--black); color: var(--white);
  border: none; border-radius: 4px;
  font-size: 14px; line-height: 19px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.btn-black-sm {
  height: 32px; padding: 0 12px;
  background: var(--black); color: var(--white);
  border: none; border-radius: 4px;
  font-size: 13px; line-height: 18px;
  cursor: pointer; white-space: nowrap;
}
.text-sell-now {
  font-size: 14px; line-height: 19px;
  color: var(--black); white-space: nowrap; flex-shrink: 0;
}

/* Desktop icon row */
.nav-icons { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.icon-28 {
  width: 28px; height: 28px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.avatar-28 {
  width: 22px; height: 22px; border-radius: 50%; overflow: hidden; flex-shrink: 0; cursor: pointer;
}
.avatar-28 img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Mobile icon row */
.mobile-icons { display: flex; align-items: center; gap: 10px; }
.icon-24 { width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; }
.avatar-24 { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex-shrink: 0; cursor: pointer; }
.avatar-24 img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Search internals */
.search-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.search-left  { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
.search-cat   { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.search-cat span { font-size: 15px; line-height: 20px; color: var(--black); white-space: nowrap; }
.search-div   { width: 1px; height: 12px; flex-shrink: 0; background: #e3e3e3; }
.search-ph    { font-size: 15px; line-height: 20px; color: var(--gray-300); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.search-icon  { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

/* Submenu */
.nav-submenu-items { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.sub-link {
  font-size: 15px; line-height: 20px; color: var(--black);
  text-decoration: none; white-space: nowrap; flex-shrink: 0; padding: 0 1px;
}
.sub-link:hover { text-decoration: underline; }
.sub-link.active { font-weight: 400; }
.sub-live { display: flex; align-items: center; gap: 2px; text-decoration: none; flex-shrink: 0; }
.sub-live span { font-size: 15px; line-height: 20px; color: var(--posh-live); white-space: nowrap; }

/* ===================== VARIANTS ===================== */
.variant-page{display:none}
.variant-page.active{display:block}

/* ===================== CONTENT ===================== */
.page-wrap{width:1388px;margin:0 auto;padding:48px 0 120px}

.breadcrumb{
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:#717171;margin-bottom:12px;
}
.breadcrumb a,.breadcrumb-link{color:#717171;cursor:pointer}
.breadcrumb a:hover,.breadcrumb-link:hover{text-decoration:underline}
.breadcrumb-sep{font-size:10px;color:#aaa}

.page-title{
  font-family:'Nantes', serif;
  font-size:28px;font-weight:600;color:#121212;
  line-height:1.25;margin-bottom:32px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ===================== SUBCATEGORY SCROLLER ===================== */
.subcat-wrap{position:relative;margin-bottom:20px;display:none}
.subcat-wrap.active{display:block}
.subcat-scroll{overflow:hidden}
.subcat-row{display:flex;gap:23px;align-items:flex-start;transition:transform 0.3s ease}
.subcat-item{width:104px;height:148px;flex-shrink:0;position:relative;cursor:pointer;background:none;border:none;padding:0}
.subcat-img-circle{position:absolute;top:4px;left:4px;width:96px;height:96px;border-radius:50%;overflow:hidden;background:#f2f2f2}
.subcat-img-circle img{width:100%;height:100%;object-fit:cover}
.subcat-ring{position:absolute;top:0;left:0;width:104px;height:104px;border:1.1px solid #121212;border-radius:50%;opacity:0;transition:opacity 0.15s;pointer-events:none}
.subcat-item.active .subcat-ring{opacity:1}
.subcat-item.active .subcat-label{font-weight:600}
.subcat-label{position:absolute;top:108px;left:50%;transform:translateX(-50%);width:96px;font-size:13px;line-height:18px;color:#121212;text-align:center}
.subcat-btn-next,.subcat-btn-prev{position:absolute;top:52px;transform:translateY(-50%);background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
.subcat-btn-next{right:-20px}
.subcat-btn-prev{left:-20px}
.subcat-wrap:hover .subcat-btn-next.active{opacity:1;pointer-events:auto}
.subcat-wrap:hover .subcat-btn-prev.visible{opacity:1;pointer-events:auto}

/* ===================== CATEGORY CAROUSEL ===================== */
.cat-carousel-wrap{position:relative;margin-bottom:38px;overflow:hidden}
.cat-carousel-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,86px);
  gap:12px;
}
.cat-carousel-item{
  position:relative;height:86px;
  background:#f9f9f9;border:none;
  cursor:pointer;overflow:hidden;
  text-align:left;
}
.cat-carousel-item:hover .cat-thumb-label{text-decoration:underline}
.cat-carousel-item[title]:hover::after{
  content:attr(title);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:rgba(18,18,18,0.8);color:#fff;font-size:11px;line-height:1.4;
  padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;
  z-index:10;
}
.cat-thumb{
  position:absolute;left:0;top:0;
  width:65px;height:86px;
  object-fit:cover;display:block;
}
.cat-thumb-label{
  position:absolute;
  left:calc(50% - 48px);
  top:50%;transform:translateY(-50%);
  font-size:14px;font-weight:500;color:#121212;
  line-height:19px;white-space:nowrap;
}
.cat-carousel-next,.cat-carousel-prev{
  position:absolute;top:50%;transform:translateY(-50%);
  background:none;border:none;padding:0;cursor:pointer;
  z-index:2;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.15s;
}
.cat-carousel-next{right:0}
.cat-carousel-prev{left:0}
.cat-carousel-wrap:hover .cat-carousel-next.active{opacity:1;pointer-events:auto}
.cat-carousel-wrap:hover .cat-carousel-prev.visible{opacity:1;pointer-events:auto}


@keyframes carouselOutLeft  { to  { transform:translateX(-100%) } }
@keyframes carouselOutRight { to  { transform:translateX(100%)  } }
@keyframes carouselInRight  { from{ transform:translateX(100%)  } }
@keyframes carouselInLeft   { from{ transform:translateX(-100%) } }
.carousel-exiting{position:absolute;top:0;left:0;width:100%;pointer-events:none}

/* ===================== FILTER BAR ===================== */
.filter-bar{
  display:flex;align-items:center;
  justify-content:space-between;
  height:34px;margin-bottom:24px;
  gap:12px;
}
.filter-left{
  display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
  overflow-x:auto;
}
.filter-left::-webkit-scrollbar{display:none}
.filter-divider{
  width:1px;height:21px;background:#ccc;
  flex-shrink:0;margin:0 4px;
}
.filter-pill{
  display:inline-flex;align-items:center;gap:4px;
  height:34px;padding:0 11px 0 14px;
  border:1px solid #ccc;border-radius:100px;
  font-size:13px;color:#121212;
  background:none;white-space:nowrap;flex-shrink:0;
  transition:border-color .15s;
}
.filter-pill:hover{border-color:#999}
.filter-pill.is-active{
  border-color:#121212;background:rgba(0,0,0,.03);
  font-weight:500;
}
.filter-pill-icon{
  width:34px;padding:0;justify-content:center;
}
.filter-chip{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 10px 0 14px;
  border:1px solid rgba(97,7,34,.2);border-radius:100px;
  background:rgba(252,219,215,.6);
  font-size:13px;font-weight:500;color:#ba4e41;
  white-space:nowrap;flex-shrink:0;cursor:pointer;
}
.filter-chip:hover{background:rgba(252,219,215,.85)}
.chip-x{
  width:14px;height:14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;line-height:1;color:#ba4e41;
  background:rgba(186,78,65,.12);
}

.sort-btn{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 11px 0 14px;
  border:1px solid #ccc;border-radius:100px;
  font-size:13px;color:#121212;
  background:none;white-space:nowrap;flex-shrink:0;
}
.sort-btn:hover{border-color:#999}

/* ===================== PRODUCT GRID ===================== */
.product-grid{
  display:grid;
  grid-template-columns:repeat(6,213px);
  gap:32px 22px;
}
.product-card{
  display:flex;flex-direction:column;gap:8px;cursor:pointer;
}
.product-card:hover .product-img-wrap img{
  transform:scale(1.03);
}
.product-img-wrap{
  width:213px;height:284px;
  background:#f2f2f2;overflow:hidden;
  position:relative;flex-shrink:0;
}
.product-img-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .3s ease;
}
.badge-free{
  position:absolute;bottom:8px;left:8px;
  background:#121212;color:#fff;
  font-size:10px;font-weight:600;
  padding:3px 7px 3px 5px;
  display:flex;align-items:center;gap:3px;
}
.badge-heart{
  position:absolute;top:8px;right:8px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(246,246,246,.75);
  border:1px solid rgba(255,255,255,.6);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
}
.badge-heart:hover{background:rgba(246,246,246,.95)}
.product-info{padding:0 4px;display:flex;flex-direction:column;gap:4px}
.product-title-row{
  display:flex;align-items:flex-start;gap:4px;width:100%;
}
.badge-ad{
  flex-shrink:0;border:1px solid #e3e3e3;
  font-size:10px;font-weight:500;color:#121212;
  padding:2px 4px;line-height:10px;white-space:nowrap;
}
.badge-nwt{
  flex-shrink:0;display:inline-flex;align-items:center;
}
.product-name{
  font-size:13px;color:#121212;line-height:1.38;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  min-width:0;flex:1;
}
.product-price-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
}
.product-prices{display:flex;align-items:baseline;gap:5px}
.price-now{font-size:14px;font-weight:600;color:#121212}
.price-was{font-size:13px;font-weight:500;color:#999;text-decoration:line-through}
.product-size{font-size:13px;color:#999}

/* ===================== BREADCRUMB REFRESH FLASH ===================== */
@keyframes bcFlash{0%,100%{opacity:1}40%{opacity:0.25}}
.bc-flash{animation:bcFlash 0.35s ease}

/* ===================== TOAST ===================== */
#toast{
  position:fixed;bottom:130px;left:50%;transform:translateX(-50%);
  background:rgba(18,18,18,0.82);color:#fff;
  font-size:13px;line-height:1.4;padding:10px 20px;border-radius:20px;
  opacity:0;transition:opacity 0.22s;pointer-events:none;
  z-index:1000;white-space:nowrap;
}
#toast.show{opacity:1}

/* ===================== LOADING ===================== */
.loading-row{
  display:flex;align-items:center;justify-content:center;
  gap:12px;padding:40px 0 20px;
  font-size:15px;color:#717171;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-spin{
  width:22px;height:22px;
  border:2px solid #e0e0e0;
  border-top-color:#121212;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

/* ===================== CATEGORY PANEL ===================== */
#cat-panel{
  position:fixed;width:283px;
  max-height:520px;overflow-y:auto;
  background:#fff;border-radius:8px;
  border:1px solid #ececec;
  box-shadow:0px 18px 55px 0px rgba(0,0,0,.15);
  z-index:500;display:none;
}

/* ===================== BOTTOM CONTROLS ===================== */
#refresh-btn{
  position:fixed;bottom:76px;right:24px;
  background:#121212;color:#fff;border:none;
  border-radius:24px;padding:11px 18px;
  font-size:13px;font-weight:500;z-index:200;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  transition:background .15s;
}
#refresh-btn:hover{background:#333}

.variant-switcher{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(18,18,18,.88);backdrop-filter:blur(8px);
  border-radius:8px;padding:6px 10px;
  display:flex;gap:6px;z-index:300;
}
.vbtn{
  background:transparent;border:1px solid rgba(255,255,255,.25);
  color:rgba(255,255,255,.65);border-radius:4px;
  padding:5px 14px;font-size:12px;
}
.vbtn.on{background:#fff;color:#121212;border-color:#fff;font-weight:600}
</style>
</head>

      <button class="btn-black-sm" id="mob-login-btn">Log In</button>

/* ==================== IMAGE SEEDS ==================== */
let SEEDS = generateSeeds();

function generateSeeds(){
  const grids = {};
  ['v1','v2','v3','v4','v5'].forEach(v=>{
    grids[v] = Array.from({length:30},(_,i)=>rndSeed(v+i));
  });
  const cats = {};
  CATEGORY_ITEMS.forEach(c=>{ cats[c.seed] = rndSeed(c.seed); });
  return {grids, cats};
}

function rndSeed(base){
  return base + Math.random().toString(36).slice(2,6);
}

function refreshImages(){
  const grid = document.getElementById('v5-grid');
  if(!grid) return;
  const imgs = grid.querySelectorAll('.product-img');
  imgs.forEach(img => { img.style.transition = 'opacity 0.15s'; img.style.opacity = '0'; });
  setTimeout(()=>{
    SEEDS = generateSeeds();
    renderAllGrids();
    const newImgs = document.getElementById('v5-grid').querySelectorAll('.product-img');
    newImgs.forEach(img => {
      img.style.opacity = '0';
      img.style.transition = 'opacity 0.25s';
      // fade in after browser paints new src
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ img.style.opacity = '1'; }); });
    });
  }, 150);
}

function renderGrid(containerId, seeds){
  const el = document.getElementById(containerId);

  el.innerHTML = seeds.map((seed,i)=>{

    const price = PRICES[i % PRICES.length];
    const size  = SIZES[i % SIZES.length];
    const [hasAd,hasNwt] = BADGES[i%4];
    const hasFree = i%3 !== 2;
    return makeCard(name,price,size,hasFree,hasAd,hasNwt,seed);
  }).join('');

const carouselPageState = {};

function renderCarousel(containerId, page){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.className = 'cat-carousel-grid';
  if(page === undefined) page = carouselPageState[containerId] || 0;
  carouselPageState[containerId] = page;
  const items = CAROUSEL_PAGES[page] || CAROUSEL_PAGES[0];
  const variantId = containerId.replace('-cat-carousel','');
  el.innerHTML = items.map(item=>{
    const seed = SEEDS.cats[item.seed] || item.seed;
    const safeLabel = item.label.replace(/'/g,"\\'");
    return `<button class="cat-carousel-item" onclick="carouselCatSelect('${variantId}','${safeLabel}',${page})" title="Try selecting this category">
      <img class="cat-thumb" src="https://picsum.photos/seed/${seed}/130/172" loading="lazy" alt="${item.label}">
      <span class="cat-thumb-label">${item.label}</span>
    </button>`;
  }).join('');
  // update prev/next button visibility
  const wrap = el.closest('.cat-carousel-wrap');
  if(wrap){
    const prevBtn = wrap.querySelector('.cat-carousel-prev');
    const nextBtn = wrap.querySelector('.cat-carousel-next');
    if(prevBtn) prevBtn.classList.toggle('visible', page > 0);
    if(nextBtn) nextBtn.classList.toggle('active', page < CAROUSEL_PAGES.length - 1);
  }
}

function doCarouselSlide(gridId, nextPage, dir){
  const grid = document.getElementById(gridId);
  if(!grid) return;
  const DUR = 300;
  const outAnim = dir === 'left' ? 'carouselOutLeft' : 'carouselOutRight';
  const inAnim  = dir === 'left' ? 'carouselInRight' : 'carouselInLeft';
  // Clone current content and animate it out
  const clone = grid.cloneNode(true);
  clone.id = '';
  clone.classList.add('carousel-exiting');
  clone.style.animation = `${outAnim} ${DUR}ms ease forwards`;
  grid.parentElement.appendChild(clone);
  // Render new content and animate it in
  renderCarousel(gridId, nextPage);
  grid.style.animation = `${inAnim} ${DUR}ms ease forwards`;
  setTimeout(()=>{ clone.remove(); grid.style.animation = ''; }, DUR + 20);
}

function carouselNext(btn){
  const grid = btn.closest('.cat-carousel-wrap').querySelector('.cat-carousel-grid');
  const cur = carouselPageState[grid.id] || 0;
  if(cur >= CAROUSEL_PAGES.length - 1) return;
  doCarouselSlide(grid.id, cur + 1, 'left');
}

function carouselPrev(btn){
  const grid = btn.closest('.cat-carousel-wrap').querySelector('.cat-carousel-grid');
  const cur = carouselPageState[grid.id] || 0;
  if(cur <= 0) return;
  doCarouselSlide(grid.id, cur - 1, 'right');
}

function renderAllCarousels(){

}

const panelState = {
  open:false, deptId:null, expandedCatId:null, anchorBtn:null, anchorBarId:null,
  // 선택 기억
  selectedDeptId:null, selectedCatId:null, selectedSubLabel:null
};
let filterIdSeq = 0;

function toggleCatPanel(btn, barId){
  if(panelState.open && panelState.anchorBtn === btn){
    closeCatPanel(); return;
  }
  panelState.open = true;
  panelState.anchorBtn = btn;
  panelState.anchorBarId = barId;

  // 저장된 선택이 없으면 기존 chip 텍스트에서 추론
  if(!panelState.selectedDeptId){
    const leftId = barId.replace('filter-bar','filter-left');
    const chip = document.querySelector('#'+leftId+' .filter-chip[data-type="category"]');
    if(chip){
      const txt = chip.childNodes[0].textContent.trim();
      const directDept = CAT_TREE.find(d => d.label === txt);
      if(directDept){
        panelState.selectedDeptId   = directDept.id;
        panelState.selectedCatId    = null;
        panelState.selectedSubLabel = 'All';
      } else {
        const slash = txt.indexOf(' / ');
        if(slash > -1){
          const catLabel = txt.slice(0, slash);
          const subLabel = txt.slice(slash + 3);
          for(const d of CAT_TREE){
            const cat = d.cats.find(c => c.label === catLabel);
            if(cat){ panelState.selectedDeptId=d.id; panelState.selectedCatId=cat.id; panelState.selectedSubLabel=subLabel; break; }
          }
        }
      }
    }
  }

  // 선택 위치 레벨로 복원
  if(panelState.selectedDeptId){
    panelState.deptId = panelState.selectedDeptId;
    panelState.expandedCatId = panelState.selectedCatId || null;
  } else {
    panelState.deptId = null;
    panelState.expandedCatId = null;
  }

  positionPanel(btn);
  renderPanel();
  document.getElementById('cat-panel').style.display = 'block';
}

function closeCatPanel(){
  document.getElementById('cat-panel').style.display = 'none';
  panelState.open = false;
  panelState.anchorBtn = null;
}

let _panelFixedTop = null;
let _panelFixedLeft = null;

function positionPanel(btn){
  if(_panelFixedTop !== null){
    // 위치 고정 — 처음 계산한 값 재사용
    const panel = document.getElementById('cat-panel');
    panel.style.top  = _panelFixedTop  + 'px';
    panel.style.left = _panelFixedLeft + 'px';
    return;
  }
  const rect = btn.getBoundingClientRect();
  const panel = document.getElementById('cat-panel');
  const top  = rect.bottom + 8;
  const left = rect.left;
  const winW = window.innerWidth;
  const panW = 283;
  _panelFixedTop  = top;
  _panelFixedLeft = Math.min(left, winW - panW - 16);
  panel.style.top  = _panelFixedTop  + 'px';
  panel.style.left = _panelFixedLeft + 'px';
}

        <span style="flex:1;${catSelected?'font-weight:500':''}">${cat.label}</span>
        ${hasSubs ? `<button onclick="event.stopPropagation();toggleCatExpand('${cat.id}')"
                            style="background:none;border:none;cursor:pointer;padding:6px 14px 6px 6px;display:flex;align-items:center;flex-shrink:0;color:#121212">
          ${isExpanded ? CHEVRON_UP : CHEVRON_DOWN}
        </button>` : ''}
      </li>`;

    if(isExpanded && hasSubs){
      for(const s of cat.subs.filter(s=>s!=='All')){
        const subSelected = isCatMatch && panelState.selectedSubLabel===s;
        rows += `
          <li onclick="catSelect('${dept.id}','${cat.id}','${cat.label}','${s.replace(/'/g,"\\'")}')"
              style="display:flex;align-items:center;gap:8px;padding:0 18px 0 42px;cursor:pointer;font-size:13px;line-height:18px"
              onmouseenter="this.style.background='#f8f8f8'" onmouseleave="this.style.background=''">
            ${subSelected ? RADIO_ON : RADIO_SVG}
            <span>${s}</span>
          </li>`;
      }
    }
  }

  panel.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;padding:14px 18px;border-bottom:1px solid #ececec">
      <button onclick="catGoBack(0)"
              style="background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:0;flex-shrink:0;color:#121212">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.16406 12.5033L1.82841 8.16768L6.16406 3.83203" stroke="#121212" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 8.19995H13.5" stroke="black" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <span style="font-size:13px;font-weight:500;color:#121212">${dept.label}</span>
    </div>
    <ul style="list-style:none;padding:0 0 18px;margin-top:20px;display:flex;flex-direction:column;gap:20px">
      ${rows}
    </ul>`;
}

function catGoLevel1(deptId){
  panelState.deptId = deptId;
  panelState.expandedCatId = null;
  renderPanel();
}

function toggleCatExpand(catId){
  panelState.expandedCatId = (panelState.expandedCatId===catId) ? null : catId;
  renderPanel();
}

function catSelectCat(deptId, catId, catLabel){
  catSelect(deptId, catId, catLabel, 'All');
}

function catGoBack(level){
  if(level===0){ panelState.deptId=null; panelState.expandedCatId=null; }
  renderPanel();
}

function catSelect(deptId, catId, catLabel, subLabel){
  // 선택 상태 저장
  panelState.selectedDeptId   = deptId;
  panelState.selectedCatId    = catId || null;
  panelState.selectedSubLabel = subLabel;

  const dept   = CAT_TREE.find(d=>d.id===deptId);
  const deptLbl = dept ? dept.label : '';
  const finalSel = (subLabel && subLabel !== 'All') ? subLabel : (catLabel && catLabel !== deptLbl ? catLabel : null);
  const display  = finalSel ? `${deptLbl} / ${finalSel}` : deptLbl;

  const barId = panelState.anchorBarId;
  const filterLeftEl = document.getElementById(barId.replace('filter-bar','filter-left'));
  if(filterLeftEl){
    // Remove existing category chip
    filterLeftEl.querySelectorAll('.filter-chip[data-type="category"]').forEach(c=>c.remove());
    // Add new chip before divider or at end
    const divider = filterLeftEl.querySelector('.filter-divider');
    const chip = document.createElement('span');
    chip.className = 'filter-chip';
    chip.setAttribute('data-type','category');
    chip.innerHTML = `${display} <span class="chip-x" onclick="removeChip(this.parentElement,'${barId.replace('filter-bar','filter-left')}')">✕</span>`;
    chip.onclick = function(e){ if(!e.target.classList.contains('chip-x')) return; removeChip(chip, barId.replace('filter-bar','filter-left')); };
    if(divider) filterLeftEl.insertBefore(chip, divider.nextSibling);
    else filterLeftEl.appendChild(chip);

    // Show divider if hidden
    if(divider) divider.style.display = '';
  }

  // Mark category btn as active
  const catBtn = panelState.anchorBtn;
  if(catBtn){ catBtn.classList.add('is-active'); }

  // Update breadcrumb of the current variant
  const variantId = barId.replace('-filter-bar','');
  const variantEl = document.getElementById(variantId);
  if(variantEl){
    const bc = variantEl.querySelector('.breadcrumb');
    if(bc){
      bc.innerHTML = buildBreadcrumbHtml(variantId, deptLbl, deptId, catId ? catLabel : '', catId, subLabel);
    }

    // Update page title
    const titleEl = variantEl.querySelector('.page-title');
    if(titleEl){
      if(catId && subLabel && subLabel !== 'All'){
        titleEl.textContent = `${deptLbl}'s ${subLabel}`;
      } else if(catId){
        titleEl.textContent = `${deptLbl}'s ${catLabel}`;
      } else {
        titleEl.textContent = `${deptLbl}'s Clothing, Accessories & Shoes`;
      }
    }

    // Toggle carousel vs subcat scroller
    const carousel = variantEl.querySelector('.cat-carousel-wrap');
    const subcatWrap = document.getElementById(variantId + '-subcat');
    if(catId){
      // 3-item breadcrumb → show subcat scroller
      if(carousel) carousel.style.display = 'none';
      if(subcatWrap){
        const cat = dept ? dept.cats.find(c=>c.id===catId) : null;
        if(cat) renderSubcat(variantId, cat, subLabel);
        subcatWrap.classList.add('active');
      }
    } else {
      // 2-item breadcrumb → show carousel
      if(carousel) carousel.style.display = '';
      if(subcatWrap) subcatWrap.classList.remove('active');
    }
  }

  renderPanel();
}

/* ==================== TOAST ==================== */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.classList.remove('show'); }, 2200);
}

/* ==================== BREADCRUMB HELPERS ==================== */
function buildBreadcrumbHtml(variantId, deptLbl, deptId, catLbl, catId, subLabel){
  const hasCat    = !!(catLbl && catLbl !== deptLbl && catId);
  const hasSubcat = !!(subLabel && subLabel !== 'All');
  let html = `<a href="#" onclick="breadcrumbNav('${variantId}','home');return false">Home</a>`;
  if(deptLbl){
    html += `<span class="breadcrumb-sep">›</span><span class="breadcrumb-link" onclick="breadcrumbNav('${variantId}','dept','${deptId}')">${deptLbl}</span>`;
  }
  if(hasCat){
    html += `<span class="breadcrumb-sep">›</span><span class="breadcrumb-link" onclick="breadcrumbNav('${variantId}','cat','${deptId}','${catId}')">${catLbl}</span>`;
  }
  if(hasSubcat){
    html += `<span class="breadcrumb-sep">›</span><span class="breadcrumb-link" onclick="breadcrumbNav('${variantId}','subcat','${deptId}','${catId}','${subLabel}')">${subLabel}</span>`;
  }
  return html;
}

function breadcrumbNav(variantId, level, deptId, catId, subLabel){
  panelState.anchorBarId = variantId + '-filter-bar';
  panelState.anchorBtn   = document.getElementById(variantId + '-cat-btn');
  if(level === 'home'){
    showToast('Prototype: Clicking Home in the breadcrumb navigates to the home screen.');
    return;
  }
  refreshImages();
  if(level === 'dept'){
    const dept = CAT_TREE.find(d => d.id === deptId);
    if(dept) catSelect(deptId, '', dept.label, 'All');
  } else if(level === 'cat'){
    const dept = CAT_TREE.find(d => d.id === deptId);
    const cat  = dept && dept.cats.find(c => c.id === catId);
    if(cat) catSelect(deptId, catId, cat.label, 'All');
  } else if(level === 'subcat'){
    const dept = CAT_TREE.find(d => d.id === deptId);
    const cat  = dept && dept.cats.find(c => c.id === catId);
    if(cat) catSelect(deptId, catId, cat.label, subLabel);
  }
}

/* ==================== CAROUSEL CATEGORY SELECT ==================== */
function carouselCatSelect(variantId, itemLabel, pageIdx){
  // Special label → {deptId, catId} for labels that don't match CAT_TREE exactly
  const labelMap = {
    "Girls' Clothing": {deptId:'kids', catId:'k-grl'},
    "Boys' Clothing":  {deptId:'kids', catId:'k-boy'},
    "Baby & Toddler":  {deptId:'kids', catId:'k-bby'},
    "Home Decor":      {deptId:'home', catId:'h-dec'},
    "Bedding":         {deptId:'home', catId:'h-bed'},
    "Bath":            {deptId:'home', catId:'h-bat'},
  };
  const pageDepts = ['women','men',null];
  let deptId, catId;
  if(labelMap[itemLabel]){
    ({deptId, catId} = labelMap[itemLabel]);
  } else {
    const pageDeptId = pageDepts[pageIdx];
    if(pageDeptId){
      deptId = pageDeptId;
      const dept = CAT_TREE.find(d=>d.id===deptId);
      const cat  = dept && dept.cats.find(c=>c.label===itemLabel);
      catId = cat ? cat.id : null;
    } else {
      for(const d of CAT_TREE){
        const c = d.cats.find(c=>c.label===itemLabel);
        if(c){ deptId=d.id; catId=c.id; break; }
      }
    }
  }
  if(!deptId) return;
  const dept = CAT_TREE.find(d=>d.id===deptId);
  const cat  = dept && dept.cats.find(c=>c.id===catId);
  panelState.anchorBarId = variantId+'-filter-bar';
  panelState.anchorBtn   = null;
  catSelect(deptId, catId||'', cat ? cat.label : dept.label, 'All');
}

/* ==================== SUBCATEGORY SCROLLER ==================== */
const subcatScrollState = {};

function renderSubcat(variantId, cat, selectedSub){
  const row = document.getElementById(variantId + '-subcat-row');
  if(!row) return;
  const subs = cat.subs[0] === 'All' ? cat.subs : ['All', ...cat.subs];
  const activeSub = selectedSub || 'All';
  row.innerHTML = subs.map((sub, i) => {
    const seed = `${cat.id}-${sub.toLowerCase().replace(/[\s&\/]+/g,'-')}`;
    const isActive = sub === activeSub;
    return `<button class="subcat-item${isActive?' active':''}" onclick="subcatSelect(this,'${variantId}')">
      <div class="subcat-img-circle">
        <img src="https://picsum.photos/seed/${seed}/100/100" loading="lazy" alt="${sub}">
      </div>
      <div class="subcat-ring"></div>
      <span class="subcat-label">${sub}</span>
    </button>`;
  }).join('');
  const ITEM_W = 127; // 104 + 23
  const visible = Math.floor(1388 / ITEM_W);
  // scroll so active item is in view
  const activeIdx = subs.indexOf(activeSub);
  let scrollPos = 0;
  if(activeIdx >= visible){
    scrollPos = Math.min(activeIdx, Math.max(0, subs.length - visible));
  }
  subcatScrollState[variantId] = scrollPos;
  row.style.transform = scrollPos > 0 ? `translateX(-${scrollPos * ITEM_W}px)` : 'translateX(0)';
  // show/hide prev/next btn
  const wrap = document.getElementById(variantId + '-subcat');
  if(wrap){
    const nextBtn = wrap.querySelector('.subcat-btn-next');
    const prevBtn = wrap.querySelector('.subcat-btn-prev');
    if(nextBtn) nextBtn.classList.toggle('active', subs.length > visible && scrollPos < Math.max(0, subs.length - visible));
    if(prevBtn) prevBtn.classList.toggle('visible', scrollPos > 0);
  }
}

function subcatSelect(btn, variantId){
  const row = document.getElementById(variantId + '-subcat-row');
  if(!row) return;
  row.querySelectorAll('.subcat-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const subLabel = btn.querySelector('.subcat-label').textContent.trim();
  panelState.selectedSubLabel = subLabel;

  const dept    = CAT_TREE.find(d => d.id === panelState.selectedDeptId);
  const cat     = dept && dept.cats.find(c => c.id === panelState.selectedCatId);
  const deptLbl = dept ? dept.label : '';
  const catLbl  = cat  ? cat.label  : '';

  // Update breadcrumb
  const variantEl = document.getElementById(variantId);
  if(variantEl){
    const bc = variantEl.querySelector('.breadcrumb');
    if(bc){
      bc.innerHTML = buildBreadcrumbHtml(variantId, deptLbl, panelState.selectedDeptId, catLbl, panelState.selectedCatId, subLabel);
    }
  }

  // Update filter chip
  const filterLeftEl = document.getElementById(variantId + '-filter-left');
  if(filterLeftEl){
    filterLeftEl.querySelectorAll('.filter-chip[data-type="category"]').forEach(c => c.remove());
    const finalSel2 = (subLabel && subLabel !== 'All') ? subLabel : catLbl;
    const display   = finalSel2 ? `${deptLbl} / ${finalSel2}` : deptLbl;
    const divider = filterLeftEl.querySelector('.filter-divider');
    const chip = document.createElement('span');
    chip.className = 'filter-chip';
    chip.setAttribute('data-type', 'category');
    chip.innerHTML = `${display} <span class="chip-x" onclick="removeChip(this.parentElement,'${variantId}-filter-left')">✕</span>`;
    chip.onclick = function(e){ if(!e.target.classList.contains('chip-x')) return; removeChip(chip, variantId+'-filter-left'); };
    if(divider) filterLeftEl.insertBefore(chip, divider.nextSibling);
    else filterLeftEl.appendChild(chip);
    if(divider) divider.style.display = '';
  }

  // Update page title
  const variantEl2 = document.getElementById(variantId);
  if(variantEl2){
    const titleEl = variantEl2.querySelector('.page-title');
    if(titleEl){
      if(subLabel && subLabel !== 'All'){
        titleEl.textContent = `${deptLbl}'s ${subLabel}`;
      } else {
        titleEl.textContent = `${deptLbl}'s ${catLbl}`;
      }
    }
  }
}

function subcatNext(variantId){
  const row = document.getElementById(variantId + '-subcat-row');
  if(!row) return;
  const ITEM_W = 127;
  const itemCount = row.children.length;
  const visible = Math.floor(1388 / ITEM_W);
  const max = Math.max(0, itemCount - visible);
  const cur = subcatScrollState[variantId] || 0;
  const next = Math.min(cur + visible, max);
  subcatScrollState[variantId] = next;
  row.style.transform = `translateX(-${next * ITEM_W}px)`;
  const wrap = document.getElementById(variantId + '-subcat');
  if(wrap){
    wrap.querySelector('.subcat-btn-prev')?.classList.toggle('visible', next > 0);
    wrap.querySelector('.subcat-btn-next')?.classList.toggle('active', next < max);
  }
}

function subcatPrev(variantId){
  const row = document.getElementById(variantId + '-subcat-row');
  if(!row) return;
  const ITEM_W = 127;
  const visible = Math.floor(1388 / ITEM_W);
  const cur = subcatScrollState[variantId] || 0;
  const prev = Math.max(0, cur - visible);
  subcatScrollState[variantId] = prev;
  row.style.transform = `translateX(-${prev * ITEM_W}px)`;
  const wrap = document.getElementById(variantId + '-subcat');
  if(wrap){
    wrap.querySelector('.subcat-btn-prev')?.classList.toggle('visible', prev > 0);
    wrap.querySelector('.subcat-btn-next')?.classList.add('active');
  }
}

function removeChip(chip, containerId){
  if(chip.getAttribute('data-type') === 'category'){
    panelState.selectedDeptId   = null;
    panelState.selectedCatId    = null;
    panelState.selectedSubLabel = null;
  }
  chip.remove();

  // If no chips remain → reset to "All Items" state
  const filterLeft = document.getElementById(containerId);
  if(filterLeft && !filterLeft.querySelector('.filter-chip')){
    // Hide divider
    const divider = filterLeft.querySelector('.filter-divider');
    if(divider) divider.style.display = 'none';

    // Find variant root from containerId (e.g. "v5-filter-left" → "v5")
    const variantId = containerId.replace('-filter-left','');
    const variantEl = document.getElementById(variantId);
    if(variantEl){
      // Reset breadcrumb → Home > All
      const bc = variantEl.querySelector('.breadcrumb');
      if(bc) bc.innerHTML = `<a href="#" onclick="breadcrumbNav('${variantId}','home');return false">Home</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-link" onclick="refreshImages()">All</span>`;

      // Reset Category pill to default (not active)
      const catBtn = document.getElementById(variantId + '-cat-btn');
      if(catBtn) catBtn.classList.remove('is-active');

      // Reset page title
      const titleEl = variantEl.querySelector('.page-title');
      if(titleEl) titleEl.textContent = 'All Items';

      // Hide subcat, show carousel
      const subcatWrap = document.getElementById(variantId + '-subcat');
      if(subcatWrap) subcatWrap.classList.remove('active');
      const carousel = variantEl.querySelector('.cat-carousel-wrap');
      if(carousel){ carousel.style.display = 'none'; }

      // Reset carousel to page 0
      renderCarousel(variantId + '-cat-carousel', 0);
    }

    // Refresh product images
    refreshImages();
  }
}

/* ==================== VARIANT SWITCHER ==================== */
function switchVariant(n){
  document.querySelectorAll('.variant-page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.vbtn').forEach((b,i)=>{
    b.classList.toggle('on', i===n-1);
  });
  document.getElementById('v'+n).classList.add('active');
  closeCatPanel();
}

/* ==================== OUTSIDE CLICK ==================== */
document.addEventListener('click', e=>{
  if(!panelState.open) return;
  const panel = document.getElementById('cat-panel');
  // composedPath() preserves the original event path even after innerHTML replacement
  const path = e.composedPath ? e.composedPath() : [];
  if(path.includes(panel)) return;
  if(e.target.closest && e.target.closest('.filter-pill')) return;
  closeCatPanel();
});

/* ==================== INIT ==================== */
renderAllGrids();
renderAllCarousels();
</script>
