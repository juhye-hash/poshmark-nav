<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poshmark Nav – v4</title>
<style>
/* ─── TOKENS ─────────────────────────────── */
:root {
  --black:         #121212;
  --white:         #ffffff;
  --divider:       #ececec;
  --search-bg:     #f6f6f6;
  --search-stroke: #e3e3e3;
  --gray-300:      #717171;
  --posh-live:     #ba4e41;
}

/* ─── RESET ──────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f0f0; }

/* ─── NAV SHELL ──────────────────────────── */
.nav-bar {
  background: var(--white);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--divider);
}

/* ════════════════════════════════════════════
   MOBILE  (base — < 992px)
   Covers both "768-min" (393px) and "991-768" (991px) frames
   Height 56px · px-14 · hamburger + logo + right-action
════════════════════════════════════════════ */
.nav-middle-row {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  position: relative;
}

.nav-mobile-left  { display: flex; align-items: center; gap: 8px; }
.nav-mobile-right { display: flex; align-items: center; }

/* hide desktop pieces on mobile */
.nav-logo-desktop,
.nav-search,
.nav-right-desktop,
.nav-submenu-row { display: none; }


/* ════════════════════════════════════════════
   DESKTOP  (≥ 992px)
   "1066-992" frame: 992–1066px · search=370px · submenu-pad=20px
════════════════════════════════════════════ */
@media (min-width: 992px) {
  /* swap mobile ↔ desktop */
  .nav-mobile-left,
  .nav-mobile-right  { display: none; }
  .nav-logo-desktop  { display: flex; align-items: center; flex-shrink: 0; }
  .nav-right-desktop { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }

  /* Middle row: 80px, outer padding auto-centers 1388px content at wide viewports */
  .nav-middle-row {
    height: 80px;
    border-bottom: none;
    /* max(20px, …) = 20px until vw=1428px, then grows to center 1388px content */
    padding: 0 max(20px, calc((100vw - 1388px) / 2));
  }

  /* ── Search bar: absolute-centered, independent of flex siblings ── */
  .nav-search {
    display: flex;
    align-items: center;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    /* Designer annotation: clamp(370px, 104.67vw - 746.8px, 706px)
       → 370px at 1067px viewport · 706px at 1388px viewport */
    width: clamp(370px, calc(104.67vw - 746.8px), 706px);

    height: 44px;
    background: var(--search-bg);
    border: 1px solid var(--search-stroke);
    border-radius: 60px;
    padding: 0 14px 0 20px;
    cursor: pointer;
  }

  /* Submenu: base padding 20px (992–1066px) */
  .nav-submenu-row {
    display: flex;
    align-items: center;
    height: 48px;
    border-top: 1px solid var(--divider);
    padding: 0 20px;
  }
}


/* ════════════════════════════════════════════
   DESKTOP MEDIUM  (≥ 1067px)
   "1388-1067" frame: submenu-pad JUMPS to 56px
   Above 1388px it grows with max-width centering + 56px inner
════════════════════════════════════════════ */
@media (min-width: 1067px) {
  /* max(56px, …) = 56px flat until vw=1388px,
     then grows: (vw-1388)/2 + 56px to keep content centered */
  .nav-submenu-row {
    padding: 0 max(56px, calc((100vw - 1388px) / 2 + 56px));
  }
}


/* ─── COMPONENT STYLES ───────────────────── */

/* Logos */
.logo-desktop { width: 134px; height: 22px; object-fit: contain; display: block; }
.logo-mobile  { width: 112px; height: 20px; object-fit: contain; display: block; }

/* Hamburger */
.icon-shopby { width: 24px; height: 24px; flex-shrink: 0; }
.icon-shopby img { width: 100%; height: 100%; object-fit: contain; }

/* Buttons */
.btn-black-md {              /* 36px desktop */
  height: 36px; padding: 0 14px;
  background: var(--black); color: var(--white);
  border: none; border-radius: 4px;
  font-size: 14px; line-height: 19px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.btn-black-sm {              /* 32px mobile */
  height: 32px; padding: 0 12px;
  background: var(--black); color: var(--white);
  border: none; border-radius: 4px;
  font-size: 13px; line-height: 18px;
  cursor: pointer; white-space: nowrap;
}
.text-sell-now {
  font-size: 14px; line-height: 19px;
  color: var(--black); white-space: nowrap; flex-shrink: 0;
}

/* Desktop icons row (28px) */
.nav-icons { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.icon-28 {
  width: 28px; height: 28px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: visible;
  cursor: pointer;
}
.icon-28 img { width: 100%; height: 100%; object-fit: contain; display: block; }
.avatar-28 {
  width: 22px; height: 22px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0; cursor: pointer;
}
.avatar-28 img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Mobile icons row (24px) */
.mobile-icons { display: flex; align-items: center; gap: 10px; }
.icon-24 { width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; }
.icon-24 img { width: 100%; height: 100%; object-fit: contain; display: block; }
.avatar-24 {
  width: 24px; height: 24px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0; cursor: pointer;
}
.avatar-24 img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Search bar internals */
.search-inner {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; gap: 0;
}
.search-left {
  display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0;
}
.search-cat {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.search-cat span { font-size: 15px; line-height: 20px; color: var(--black); white-space: nowrap; }
.chevron { width: 12px; height: 12px; flex-shrink: 0; display: flex; }
.search-div { width: 1px; height: 12px; flex-shrink: 0; background: #e3e3e3; }
.search-ph {
  font-size: 15px; line-height: 20px; color: var(--gray-300);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
}
.search-icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

/* Submenu items */
.nav-submenu-items {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%;
}
.sub-link {
  font-size: 15px; line-height: 20px; color: var(--black);
  text-decoration: none; white-space: nowrap; flex-shrink: 0; padding: 0 1px;
}
.sub-live {
  display: flex; align-items: center; gap: 2px;
  text-decoration: none; flex-shrink: 0;
}
.sub-live span { font-size: 15px; line-height: 20px; color: var(--posh-live); white-space: nowrap; }
.sub-live img { width: 24px; height: 24px; object-fit: contain; display: block; }


/* ─── WIDTH BADGE ────────────────────────── */
#width-badge {
  position: fixed; top: 12px; right: 12px; z-index: 9999;
  background: rgba(0,0,0,.75); color: #fff;
  font-family: monospace; font-size: 13px; font-weight: bold;
  padding: 4px 10px; border-radius: 6px;
  pointer-events: none;
}

/* ─── DEV BAR ────────────────────────────── */
#dev-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(10,10,10,.88); color: #0f0;
  font-family: monospace; font-size: 11px;
  padding: 5px 14px; display: flex; flex-wrap: wrap; gap: 16px; z-index: 9999;
}
.dv { color: #888; }
.dz { color: #ff0; font-weight: bold; }

/* ─── PAGE BODY ──────────────────────────── */
.page { padding: 32px 20px 120px; }
.page-hint { text-align: center; padding: 32px; color: #aaa; font-size: 13px; }

/* ─── TOGGLE BUTTON (fixed bottom) ─────── */
#toggle-btn-wrap {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
  z-index: 9998;
}
</style>

<script>
function clamp(min, v, max) { return Math.min(Math.max(v, min), max); }

function update() {
  const vw = window.innerWidth;
  let zone, h, s, mp, sp;

  if (vw < 992) {
    zone = '768-min / 991-768 · mobile';
    h = '56px'; s = '—';
    mp = '14px'; sp = '—';
  } else if (vw < 1067) {
    zone = '1066-992 · desktop-small';
    h = '80px';
    s  = clamp(370, 104.67*vw/100 - 746.8, 706).toFixed(0) + 'px'; // stays 370
    mp = Math.max(20, (vw-1388)/2).toFixed(0) + 'px';
    sp = '20px';
  } else if (vw < 1389) {
    zone = '1388-1067 · desktop-medium (clamp)';
    h = '80px';
    s  = clamp(370, 104.67*vw/100 - 746.8, 706).toFixed(0) + 'px';
    mp = '20px';
    sp = '56px';
  } else {
    zone = 'max-1025 · desktop-large (centered)';
    h = '80px';
    s  = '706px';
    mp = Math.max(20, (vw-1388)/2).toFixed(0) + 'px';
    sp = Math.max(56, (vw-1388)/2 + 56).toFixed(0) + 'px';
  }

  document.getElementById('width-badge').textContent = vw + 'px';
  document.getElementById('dv-vw').textContent   = vw;
  document.getElementById('dv-zone').textContent  = zone;
  document.getElementById('dv-h').textContent     = h;
  document.getElementById('dv-s').textContent     = s;
  document.getElementById('dv-mp').textContent    = mp;
  document.getElementById('dv-sp').textContent    = sp;
}

window.addEventListener('resize', update);
update();

let in_ = false;
function toggleLogin() {
  in_ = !in_;
  document.getElementById('desk-out').style.display   = in_ ? 'none' : 'flex';
  document.getElementById('desk-in').style.display    = in_ ? 'flex' : 'none';
  document.getElementById('mob-login-btn').style.display = in_ ? 'none' : '';
